name: blog-stack
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [blog, web, server]
  blog:
    build: ./oxygen-fresh
    restart: unless-stopped
    env_file: ./env/oxygen.env
    environment:
      PORT: "8000"
      KV_PATH: /app/data/kv.sqlite3
      UPLOAD_DIR: /app/static/uploads
      SITE_URL: https://ahtx.ru
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/static/uploads
  server:
    build: ./intercode/server
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PORT: "8090"
      DATA_DIR: /app/data
    volumes:
      - intercode-data:/app/data
  web:
    build: ./intercode
    restart: unless-stopped
    volumes:
      - ./config/intercode-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [server]
volumes:
  blog-data:
    name: blog-stack-blog-data
  blog-uploads:
    name: blog-stack-blog-uploads
  intercode-data:
    name: blog-stack-intercode-data
  caddy-data:
    name: blog-stack-caddy-data
  caddy-config:
    name: blog-stack-caddy-config
